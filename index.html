<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dinnerd Recipes</title>
<!--
  Read-only Dinnerd kitchen viewer (old iPad first, HomeView later). Recipes only, current
  version only. Never writes to iCloud.

  Data access: CloudKit JS 2, Apple's official web access to iCloud
  (https://developer.apple.com/documentation/cloudkitjs): setUpAuth for sign-in,
  privateCloudDatabase + sharedCloudDatabase, fetchAllRecordZones + fetchRecordZoneChanges
  (whole zones, no query indexes), fetchRecords for one recipe on open.

  NOT an official Apple procedure: reading the record layout NSPersistentCloudKitContainer
  writes (record types CD_<Entity>, fields CD_<attribute>, to-one relationships as the target's
  record name, large binaries as CD_<attribute>_ckAsset). Field names track the Core Data model
  (RecipeApp.xcdatamodeld); a model rename breaks this page.

  Libraries: private database = mine. A shared zone whose Household id equals my own
  Household's joinedKitchenID is my joined household library (also mine). Every other shared
  zone is a friend's library, named like the app does (LibrarySwitcherViewModel.libraryTitle).

  Pins: the app keeps pins in iCloud key-value storage, which web pages can't read. The app will
  also write CD_PinnedRecipe records (CD_recipeIDStorage, CD_sortIndexStorage) to the private
  database; until then the Pinned section stays hidden.
-->
<style>
  :root {
    --bg: #FBFAF8; --surface: #FFFFFF; --text: #1A1A1A; --text2: #5A554B;
    --muted: #B8815B; --mutedText: #96593A; --accent: #D96A15; --line: rgba(0,0,0,0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1B1917; --surface: #2A2420; --text: #EDEBE7; --text2: #BDB4A4;
      --muted: #C99680; --mutedText: #C99680; --accent: #E8823A; --line: rgba(255,255,255,0.12); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 20px/1.45 -apple-system, "Helvetica Neue", Helvetica, sans-serif; -webkit-text-size-adjust: 100%; }
  .serif { font-family: "New York", ui-serif, Georgia, serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 16px 24px 12px;
    border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .bar h1 { flex: 1; margin: 0; font-size: 30px; min-width: 200px; }
  button { font: inherit; font-size: 18px; padding: 10px 18px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--muted); background: var(--surface); color: var(--mutedText); min-height: 48px; }
  .tools { display: flex; gap: 12px; margin-top: 12px; }
  .tools input { flex: 1; min-width: 0; }
  select { font: inherit; font-size: 18px; padding: 10px 14px; border-radius: 12px; min-height: 48px;
    border: 1px solid var(--muted); background: var(--surface); color: var(--mutedText); }
  input[type=search] { width: 100%; font: inherit; padding: 12px 16px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text); -webkit-appearance: none; }
  main { padding: 8px 24px 48px; }
  h2 { font-size: 18px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text2); margin: 24px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0 24px; }
  .row { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line);
    cursor: pointer; min-height: 72px; }
  .row img, .row .ph { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex: none; background: var(--surface); }
  .row .t { font-size: 22px; }
  #status { color: var(--text2); margin: 16px 0; }
  #status.error { color: #c0392b; white-space: pre-wrap; }
  .hero { width: 100%; max-height: 420px; object-fit: cover; border-radius: 16px; margin: 16px 0 0; }
  .detail h1 { font-size: 38px; margin: 16px 0 4px; }
  .detail .meta { color: var(--text2); margin-bottom: 8px; }
  .cols { display: grid; grid-template-columns: minmax(260px, 1fr) 2fr; gap: 40px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; gap: 0; } }
  @media (min-width: 761px) {
    .detail .cols { height: calc(var(--vh, 100vh) - var(--hdr, 90px) - 8px); }
    .detail .cols > div { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 8px 48px 0; overscroll-behavior: contain; }
  }
  .detail ul { list-style: none; padding: 0; margin: 0; }
  .detail li { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .detail li.ing { cursor: pointer; min-height: 44px; -webkit-user-select: none; user-select: none; }
  .detail li.ing.done { text-decoration: line-through; opacity: 0.45; }
  .detail h3 { font-size: 24px; margin: 24px 0 8px; }
  .detail h4 { font-size: 20px; margin: 18px 0 4px; color: var(--mutedText); }
  ol.steps { padding-left: 1.6em; margin: 0; }
  ol.steps li { padding: 10px 0 10px 6px; font-size: 22px; }
  .note { background: var(--surface); border-left: 4px solid var(--muted); padding: 10px 14px; border-radius: 8px; margin: 8px 0; }
  .friends a { display: block; padding: 18px 0; border-bottom: 1px solid var(--line); font-size: 24px; color: var(--text);
    text-decoration: none; cursor: pointer; }
  [hidden] { display: none !important; }
  #auth { margin-top: 8px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 id="title" class="serif">My Recipes</h1>
    <button id="backToList" hidden>Back</button>
    <button id="friendsBtn" hidden>Friends' Recipes</button>
    <button id="mineBtn" hidden>Back to My Recipes</button>
  </div>
  <div class="tools" id="tools" hidden>
    <input id="search" type="search" placeholder="Search" autocomplete="off">
    <select id="sort" aria-label="Sort">
      <option value="newest">Newest</option>
      <option value="alphabetical">Alphabetical</option>
      <option value="lastCooked">Last Cooked</option>
      <option value="highestRated">Highest Rated</option>
      <option value="totalTime">Total Time</option>
      <option value="numberCooked">Times Made</option>
      <option value="activePrepTime">Active Prep Time</option>
      <option value="ingredientCount">Ingredient Count</option>
    </select>
  </div>
  <div id="auth"><div id="sign-in-button"></div><div id="sign-out-button" hidden></div></div>
</header>
<main>
  <div id="status">Loading…</div>
  <section id="listView" hidden>
    <div id="pinnedWrap" hidden><h2>Pinned</h2><div id="pinned" class="grid"></div><h2>All Recipes</h2></div>
    <div id="list" class="grid"></div>
  </section>
  <section id="friendsView" class="friends" hidden></section>
  <section id="detailView" class="detail" hidden></section>
</main>

<script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"></script>
<script>
"use strict";

var API_TOKEN = "d881113a273253bee01ec645c0194cb60a0c29d6d769ff722f525d53eb0ceb50";
var REFRESH_MS = 5 * 60 * 1000;
var LIST_KEYS = [
  "CD_idStorage", "CD_currentSnapshot", "CD_deletedAtStorage",
  "CD_createdAtStorage", "CD_ratingStorage", "CD_lastCookedAtStorage", "CD_cookCountStorage",
  "CD_nameStorage", "CD_joinedKitchenIDStorage"
];
var PIN_KEYS = ["CD_recipeIDStorage", "CD_sortIndexStorage"];

var $ = function (id) { return document.getElementById(id); };
var state = {
  libraries: [],   // { key, name, isMine, recipes: [...] }
  pins: [],        // recipe UUID strings in order
  view: "mine",    // "mine" | "friends" | "friend"
  friendKey: null,
  openRecipe: null,
  loadedOnce: false
};

function say(text, isError) {
  var s = $("status");
  s.hidden = !text;
  s.textContent = text || "";
  s.className = isError ? "error" : "";
}
function errText(e) {
  return (e && (e.ckErrorCode || e.serverErrorCode || e.reason || e.message)) || String(e);
}
function field(r, name) {
  var f = r.fields && r.fields[name];
  return f ? f.value : null;
}
function base64ToText(b64) {
  var bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) { bytes[i] = bin.charCodeAt(i); }
  return new TextDecoder("utf-8").decode(bytes);
}
// A Core Data binary attribute arrives as BYTES (base64) or, when large, as an ASSET.
function readJSON(r, name) {
  var inline = field(r, name);
  if (inline) { try { return Promise.resolve(JSON.parse(base64ToText(inline))); } catch (e) { return Promise.resolve(null); } }
  var asset = field(r, name + "_ckAsset");
  if (asset && asset.downloadURL) {
    return fetch(asset.downloadURL).then(function (res) { return res.json(); }).catch(function () { return null; });
  }
  return Promise.resolve(null);
}
function imageURL(r, name) {
  var inline = field(r, name);
  if (inline) { return "data:image/jpeg;base64," + inline; }
  var asset = field(r, name + "_ckAsset");
  return asset && asset.downloadURL ? asset.downloadURL : null;
}
function libraryTitle(name) {
  var n = (name || "").trim();
  if (!n) { return "Friend's Library"; }
  var l = n.toLowerCase();
  return (l.indexOf("library") >= 0 || l.indexOf("kitchen") >= 0) ? n : n + "'s Library";
}
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) { e.className = cls; }
  if (text != null) { e.textContent = text; }
  return e;
}

function start() {
  CloudKit.configure({
    containers: [{
      containerIdentifier: "iCloud.com.jasonyohman.recipeapp",
      apiTokenAuth: {
        apiToken: API_TOKEN,
        persist: true,
        signInButton: { id: "sign-in-button", theme: "black" },
        signOutButton: { id: "sign-out-button", theme: "black" }
      },
      environment: "production"
    }]
  });
  var container = CloudKit.getDefaultContainer();

  function waitForSignIn() {
    $("auth").hidden = false;
    say("Sign in with your Apple Account to see your recipes.");
    container.whenUserSignsIn().then(onSignedIn).catch(function (e) { say("Sign-in problem: " + errText(e), true); });
  }
  function onSignedIn() {
    $("auth").hidden = true;
    load();
    setInterval(load, REFRESH_MS);
  }
  container.setUpAuth().then(function (user) { if (user) { onSignedIn(); } else { waitForSignIn(); } })
    .catch(function (e) { say("Couldn't start: " + errText(e), true); });

  // ---------- loading ----------
  // First visit: recipe records only (no old versions, no pantry or shopping), then the
  // current version's title for each recipe. Later visits: the saved copy shows at once and
  // fetchRecordZoneChanges with the saved syncToken brings only what changed.

  var CACHE_KEY = "dinnerd-viewer-cache-v2"; // v2 adds sort fields
  try { localStorage.removeItem("dinnerd-viewer-cache-v1"); } catch (e) {}
  var cache = loadCache();
  var dbs = { "private": container.privateCloudDatabase, "shared": container.sharedCloudDatabase };

  function loadCache() {
    try { var c = JSON.parse(localStorage.getItem(CACHE_KEY)); if (c && c.zones) { return c; } } catch (e) {}
    return { zones: {} };
  }
  function saveCache() {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch (e) {}
  }
  function zoneKey(dbName, zoneID) { return dbName + "|" + zoneID.zoneName + "|" + (zoneID.ownerRecordName || ""); }
  function emptyZone(dbName, zoneID) {
    return { db: dbName, zoneID: zoneID, token: null, recipes: {}, households: {}, pins: {}, snaps: {} };
  }

  function fetchChanges(db, zoneID, types, token, acc) {
    var keys = types.indexOf("CD_PinnedRecipe") >= 0 ? LIST_KEYS.concat(PIN_KEYS) : LIST_KEYS;
    var sig = { zoneID: zoneID, desiredRecordTypes: types, desiredKeys: keys };
    if (token) { sig.syncToken = token; }
    return db.fetchRecordZoneChanges([sig]).then(function (res) {
      if (res.hasErrors) { throw res.errors[0]; }
      var z = res.zones[0];
      acc.records = acc.records.concat(z.records);
      acc.token = z.syncToken;
      return z.moreComing ? fetchChanges(db, zoneID, types, z.syncToken, acc) : acc;
    });
  }
  // CD_PinnedRecipe doesn't exist in iCloud until the app ships it; retry without it if refused.
  function fetchChangesSafe(db, zoneID, token) {
    var base = ["CD_Recipe", "CD_Household"];
    return fetchChanges(db, zoneID, base.concat(["CD_PinnedRecipe"]), token, { records: [] })
      .catch(function () { return fetchChanges(db, zoneID, base, token, { records: [] }); });
  }

  function applyChanges(z, records) {
    records.forEach(function (r) {
      var n = r.recordName;
      if (r.deleted) { delete z.recipes[n]; delete z.households[n]; delete z.pins[n]; return; }
      if (r.recordType === "CD_Recipe") {
        z.recipes[n] = { id: (field(r, "CD_idStorage") || "").toUpperCase(), snap: field(r, "CD_currentSnapshot"),
          gone: !!field(r, "CD_deletedAtStorage"), c: field(r, "CD_createdAtStorage") || 0,
          rt: field(r, "CD_ratingStorage") || 0, lc: field(r, "CD_lastCookedAtStorage") || 0,
          n: field(r, "CD_cookCountStorage") || 0 };
      } else if (r.recordType === "CD_Household") {
        z.households[n] = { id: (field(r, "CD_idStorage") || "").toUpperCase(), name: field(r, "CD_nameStorage") || "",
          joined: (field(r, "CD_joinedKitchenIDStorage") || "").toUpperCase() };
      } else if (r.recordType === "CD_PinnedRecipe") {
        z.pins[n] = { id: (field(r, "CD_recipeIDStorage") || "").toUpperCase(), order: field(r, "CD_sortIndexStorage") || 0 };
      }
    });
  }

  // Titles for current versions only, 200 per request, 3 requests at a time.
  function fetchTitles(db, z) {
    var wanted = {};
    Object.keys(z.recipes).forEach(function (n) { var s = z.recipes[n].snap; if (s && !z.recipes[n].gone) { wanted[s] = true; } });
    Object.keys(z.snaps).forEach(function (s) { if (!wanted[s]) { delete z.snaps[s]; } });
    var missing = Object.keys(wanted).filter(function (s) { return !z.snaps[s]; });
    var chunks = [];
    for (var i = 0; i < missing.length; i += 200) { chunks.push(missing.slice(i, i + 200)); }
    function next() {
      var chunk = chunks.shift();
      if (!chunk) { return Promise.resolve(); }
      return db.fetchRecords(chunk, { zoneID: z.zoneID, desiredKeys: ["CD_titleStorage", "CD_ingredientNamesStorage",
        "CD_prepTimeMinutesStorage", "CD_cookTimeMinutesStorage", "CD_totalTimeMinutesStorage", "CD_ingredientCountStorage"] })
        .then(function (res) {
          (res.records || []).forEach(function (r) {
            if (r.recordType === "CD_Snapshot") {
              z.snaps[r.recordName] = { t: field(r, "CD_titleStorage") || "", s: field(r, "CD_ingredientNamesStorage") || "",
                p: field(r, "CD_prepTimeMinutesStorage") || 0, ck: field(r, "CD_cookTimeMinutesStorage") || 0,
                tt: field(r, "CD_totalTimeMinutesStorage") || 0, ic: field(r, "CD_ingredientCountStorage") || 0 };
            }
          });
          if (!state.loadedOnce) { progress(); }
        })
        .catch(function () {})
        .then(next);
    }
    return Promise.all([next(), next(), next()]);
  }

  function progress() {
    var n = 0;
    Object.keys(cache.zones).forEach(function (k) { n += Object.keys(cache.zones[k].snaps).length; });
    say("Loading your recipes… " + n + " so far");
  }

  function syncZone(dbName, zoneID) {
    var key = zoneKey(dbName, zoneID), db = dbs[dbName];
    var z = cache.zones[key] || emptyZone(dbName, zoneID);
    z.zoneID = zoneID;
    cache.zones[key] = z;
    return fetchChangesSafe(db, zoneID, z.token).catch(function (e) {
      if (!z.token) { throw e; }
      // Saved token no longer accepted: start this zone over.
      z = emptyZone(dbName, zoneID); cache.zones[key] = z;
      return fetchChangesSafe(db, zoneID, null);
    }).then(function (acc) {
      applyChanges(z, acc.records);
      return fetchTitles(db, z).then(function () { z.token = acc.token; });
    });
  }

  function syncDatabase(dbName, seen) {
    return dbs[dbName].fetchAllRecordZones().then(function (res) {
      if (res.hasErrors) { throw res.errors[0]; }
      var zones = res.zones.filter(function (z) { return z.zoneID.zoneName !== "_defaultZone"; });
      zones.forEach(function (z) { seen[zoneKey(dbName, z.zoneID)] = true; });
      return Promise.all(zones.map(function (z) { return syncZone(dbName, z.zoneID); }));
    });
  }

  function buildLibraries() {
    var joinedIDs = {}, pins = [];
    var mine = { key: "mine", name: "My Recipes", isMine: true, recipes: [] };
    var friends = {};
    var keys = Object.keys(cache.zones);
    keys.forEach(function (k) {
      var z = cache.zones[k];
      if (z.db !== "private") { return; }
      Object.keys(z.households).forEach(function (n) { if (z.households[n].joined) { joinedIDs[z.households[n].joined] = true; } });
      Object.keys(z.pins).forEach(function (n) { pins.push(z.pins[n]); });
    });
    keys.forEach(function (k) {
      var z = cache.zones[k], db = dbs[z.db];
      var recipes = Object.keys(z.recipes).filter(function (n) {
        var r = z.recipes[n]; return !r.gone && r.snap && z.snaps[r.snap];
      }).map(function (n) {
        var r = z.recipes[n], s = z.snaps[r.snap];
        return { id: r.id, recordName: n, snapshotName: r.snap, title: s.t || "Untitled Recipe",
          search: (s.t + " " + s.s).toLowerCase(), db: db, zoneID: z.zoneID,
          created: r.c || 0, rating: r.rt || 0, lastCooked: r.lc || 0, made: r.n || 0,
          prep: s.p || 0, total: s.tt || ((s.p || 0) + (s.ck || 0)), ingredients: s.ic || 0 };
      });
      var hs = Object.keys(z.households).map(function (n) { return z.households[n]; });
      var isJoined = hs.some(function (h) { return joinedIDs[h.id]; });
      if (z.db === "private" || isJoined) { mine.recipes = mine.recipes.concat(recipes); return; }
      var owner = z.zoneID.ownerRecordName || z.zoneID.zoneName;
      if (!friends[owner]) { friends[owner] = { key: owner, name: libraryTitle(hs.length ? hs[0].name : ""), isMine: false, recipes: [] }; }
      friends[owner].recipes = friends[owner].recipes.concat(recipes);
    });
    pins.sort(function (a, b) { return a.order - b.order; });
    var seenPin = {};
    state.pins = pins.map(function (p) { return p.id; }).filter(function (id) { // two devices may write the same pin
      if (!id || seenPin[id]) { return false; } seenPin[id] = true; return true;
    });
    state.libraries = [mine].concat(Object.keys(friends).map(function (k) { return friends[k]; })
      .filter(function (f) { return f.recipes.length; })
      .sort(function (a, b) { return a.name.localeCompare(b.name); }));

  }

  function showFromCache() {
    buildLibraries();
    var any = state.libraries.some(function (l) { return l.recipes.length; });
    if (!any) { return false; }
    state.loadedOnce = true;
    say("");
    if (!state.openRecipe) { render(); }
    return true;
  }

  var loading = false;
  function load() {
    if (loading) { return; }
    loading = true;
    if (!showFromCache()) { say("Loading your recipes…"); }
    var seen = {};
    Promise.all([syncDatabase("private", seen), syncDatabase("shared", seen)])
      .then(function () {
        Object.keys(cache.zones).forEach(function (k) { if (!seen[k]) { delete cache.zones[k]; } });
        saveCache();
        showFromCache();
        if (!state.loadedOnce) { state.loadedOnce = true; say(""); render(); }
      })
      .catch(function (e) {
        if (!state.loadedOnce) { say("Couldn't load your recipes: " + errText(e), true); }
      })
      .then(function () { loading = false; });
  }

  // ---------- thumbnails: only rows on screen, fetched in small batches ----------
  var thumbCache = {}, thumbQueue = [], thumbTimer = null;
  var crossedOff = {};
  var observer = ("IntersectionObserver" in window) ? new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) { return; }
      observer.unobserve(e.target);
      thumbQueue.push(e.target);
    });
    if (thumbQueue.length && !thumbTimer) { thumbTimer = setTimeout(flushThumbs, 150); }
  }, { rootMargin: "400px 0px" }) : null;

  function flushThumbs() {
    thumbTimer = null;
    var batch = thumbQueue.splice(0, 50);
    if (!batch.length) { return; }
    var groups = {};
    batch.forEach(function (node) {
      var r = node._recipe, gk = zoneKey(r.db === dbs.private ? "private" : "shared", r.zoneID);
      (groups[gk] = groups[gk] || { recipe: r, nodes: [] }).nodes.push(node);
    });
    Object.keys(groups).forEach(function (gk) {
      var g = groups[gk];
      g.recipe.db.fetchRecords(g.nodes.map(function (n) { return n._recipe.recordName; }),
        { zoneID: g.recipe.zoneID, desiredKeys: ["CD_thumbnailData"] })
        .then(function (res) {
          (res.records || []).forEach(function (r) { thumbCache[r.recordName] = imageURL(r, "CD_thumbnailData") || ""; });
          g.nodes.forEach(function (n) { setThumb(n, thumbCache[n._recipe.recordName]); });
        }).catch(function () {});
    });
    if (thumbQueue.length) { thumbTimer = setTimeout(flushThumbs, 150); }
  }
  function setThumb(node, url) {
    if (!url) { return; }
    var img = el("img"); img.src = url; img.alt = "";
    node.replaceWith(img);
  }
  function watchThumb(node, recipe) {
    node._recipe = recipe;
    if (thumbCache.hasOwnProperty(recipe.recordName)) { setThumb(node, thumbCache[recipe.recordName]); return; }
    if (observer) { observer.observe(node); }
  }

  // ---------- views ----------

  function currentLibrary() {
    var key = state.view === "friend" ? state.friendKey : "mine";
    return state.libraries.filter(function (l) { return l.key === key; })[0] || state.libraries[0];
  }
  function show(which) {
    $("listView").hidden = which !== "list";
    $("friendsView").hidden = which !== "friends";
    $("detailView").hidden = which !== "detail";
    $("tools").hidden = which !== "list";
    $("backToList").hidden = which !== "detail";
    var hasFriends = state.libraries.length > 1;
    $("friendsBtn").hidden = !(which === "list" && state.view === "mine" && hasFriends);
    $("mineBtn").hidden = !(which !== "detail" && state.view !== "mine");
  }

  function row(recipe) {
    var r = el("div", "row");
    var ph = el("div", "ph"); r.appendChild(ph); watchThumb(ph, recipe);
    r.appendChild(el("div", "t serif", recipe.title));
    r.onclick = function () { openRecipe(recipe); };
    return r;
  }

  function render() {
    if (state.view === "friends") { renderFriends(); return; }
    var lib = currentLibrary();
    if (!lib) { return; }
    $("title").textContent = lib.name;
    var q = $("search").value.trim().toLowerCase();
    var recipes = sortRecipes(lib.recipes.filter(function (r) { return !q || r.search.indexOf(q) >= 0; }));

    var pinned = [];
    if (lib.isMine && !q && state.pins.length) {
      var byID = {};
      lib.recipes.forEach(function (r) { byID[r.id] = r; });
      pinned = state.pins.map(function (id) { return byID[id]; }).filter(Boolean);
    }
    $("pinnedWrap").hidden = !pinned.length;
    var p = $("pinned"); p.innerHTML = "";
    pinned.forEach(function (r) { p.appendChild(row(r)); });

    var list = $("list"); list.innerHTML = "";
    recipes.forEach(function (r) { list.appendChild(row(r)); });
    if (!recipes.length) { list.appendChild(el("p", null, q ? "No recipes match your search." : "No recipes yet.")); }
    show("list");
  }

  function renderFriends() {
    $("title").textContent = "Friends' Recipes";
    var box = $("friendsView"); box.innerHTML = "";
    var friends = state.libraries.filter(function (l) { return !l.isMine; });
    friends.forEach(function (f) {
      var a = el("a", "serif", f.name);
      a.onclick = function () { state.view = "friend"; state.friendKey = f.key; $("search").value = ""; render(); };
      box.appendChild(a);
    });
    show("friends");
  }

  $("friendsBtn").onclick = function () {
    var friends = state.libraries.filter(function (l) { return !l.isMine; });
    $("search").value = "";
    if (friends.length === 1) { state.view = "friend"; state.friendKey = friends[0].key; }
    else { state.view = "friends"; }
    render();
  };
  $("mineBtn").onclick = function () { state.view = "mine"; state.friendKey = null; $("search").value = ""; render(); };
  $("backToList").onclick = function () { state.openRecipe = null; render(); window.scrollTo(0, 0); };
  $("search").oninput = render;

  // Same sorts and names as the app's Sort menu (RecipeSort in RecipeListView.swift).
  // Pinned recipes keep their own order. A missing value (no rating, never cooked, no time)
  // goes last; ties go newest first, like the app.
  var SORT_KEY = "dinnerd-viewer-sort";
  var sortSel = $("sort");
  try { var savedSort = localStorage.getItem(SORT_KEY); if (savedSort) { sortSel.value = savedSort; } } catch (e) {}
  if (!sortSel.value) { sortSel.value = "alphabetical"; }
  sortSel.onchange = function () {
    try { localStorage.setItem(SORT_KEY, sortSel.value); } catch (e) {}
    render(); window.scrollTo(0, 0);
  };
  function sortRecipes(list) {
    var mode = sortSel.value;
    function newest(a, b) { return b.created - a.created; }
    function desc(k) { return function (a, b) { return (b[k] - a[k]) || newest(a, b); }; }
    function ascMissingLast(k) {
      return function (a, b) {
        var x = a[k] > 0 ? a[k] : Infinity, y = b[k] > 0 ? b[k] : Infinity;
        return (x === y ? 0 : x - y) || newest(a, b);
      };
    }
    var cmp = {
      newest: newest,
      alphabetical: function (a, b) { return a.title.localeCompare(b.title, undefined, { sensitivity: "base" }) || newest(a, b); },
      lastCooked: desc("lastCooked"),
      highestRated: desc("rating"),
      totalTime: ascMissingLast("total"),
      numberCooked: desc("made"),
      activePrepTime: ascMissingLast("prep"),
      ingredientCount: ascMissingLast("ingredients")
    }[mode] || newest;
    return list.slice().sort(cmp);
  }

  function openRecipe(recipe) {
    state.openRecipe = recipe;
    var d = $("detailView"); d.innerHTML = "";
    d.appendChild(el("h1", "serif", recipe.title));
    d.appendChild(el("p", "meta", "Loading…"));
    show("detail");
    window.scrollTo(0, 0);

    recipe.db.fetchRecords(
      [{ recordName: recipe.snapshotName, zoneID: recipe.zoneID }, { recordName: recipe.recordName, zoneID: recipe.zoneID }],
      { zoneID: recipe.zoneID }
    ).then(function (res) {
      if (res.hasErrors && !res.records.length) { throw res.errors[0]; }
      var snap = null, rec = null;
      res.records.forEach(function (r) {
        if (r.recordType === "CD_Snapshot") { snap = r; } else if (r.recordType === "CD_Recipe") { rec = r; }
      });
      if (!snap) { throw new Error("recipe text not found"); }
      return Promise.all([readJSON(snap, "CD_ingredientsData"), readJSON(snap, "CD_stepsData"), readJSON(snap, "CD_tipsData")])
        .then(function (parts) { if (state.openRecipe === recipe) { renderDetail(recipe, snap, rec, parts[0], parts[1], parts[2]); } });
    }).catch(function (e) {
      if (state.openRecipe === recipe) { d.querySelector(".meta").textContent = "Couldn't open this recipe: " + errText(e); }
    });
  }

  function renderSteps(container, steps, numbered) {
    var ol = null;
    (steps || []).forEach(function (s) {
      var text = (s.text || "").trim();
      if (!text) { return; }
      if (s.isHeading) { ol = null; container.appendChild(el("h4", null, text)); return; }
      if (s.isNote || !numbered) { ol = null; container.appendChild(el("div", "note", text)); return; }
      if (!ol) { ol = el("ol", "steps"); container.appendChild(ol); }
      ol.appendChild(el("li", null, text));
    });
  }

  function renderDetail(recipe, snap, rec, ingredients, steps, tips) {
    var d = $("detailView"); d.innerHTML = "";
    var cols = el("div", "cols");
    var left = el("div"), right = el("div");
    var hero = rec && imageURL(rec, "CD_imageData");
    if (hero) { var img = el("img", "hero"); img.src = hero; img.alt = ""; left.appendChild(img); }
    left.appendChild(el("h1", "serif", field(snap, "CD_titleStorage") || recipe.title));

    var servings = field(snap, "CD_servingsStorage");
    if (servings > 0) { left.appendChild(el("p", "meta", "Serves " + servings)); }
    var summary = field(snap, "CD_recipeSummaryStorage");
    if (summary) { left.appendChild(el("p", null, summary)); }

    left.appendChild(el("h3", "serif", "Ingredients"));
    var ul = el("ul");
    (ingredients || []).forEach(function (i) {
      var t = (i.rawText || i.name || "").trim(); // same line the app shows (RecipeDetailView)
      if (!t) { return; }
      if (i.isSectionHeader) { left.appendChild(ul); ul = el("ul"); left.appendChild(el("h4", null, t)); }
      else {
        // Tap to cross off as it's used, like the app's recipe page (CrossedOffIngredientsStore):
        // kept in memory only, so it lasts while the page is open and is never written to iCloud.
        var li = el("li", "ing", t), key = recipe.recordName + "|" + (i.id || t);
        if (crossedOff[key]) { li.className += " done"; }
        li.onclick = (function (k, node) { return function () {
          if (crossedOff[k]) { delete crossedOff[k]; node.className = "ing"; } else { crossedOff[k] = true; node.className = "ing done"; }
        }; })(key, li);
        ul.appendChild(li);
      }
    });
    left.appendChild(ul);

    right.appendChild(el("h3", "serif", "Directions"));
    renderSteps(right, steps, true);
    if (tips && tips.length) {
      right.appendChild(el("h3", "serif", "Tips & Variations"));
      renderSteps(right, tips, false);
    }
    cols.appendChild(left); cols.appendChild(right);
    d.appendChild(cols);
    measure();
  }
}

function measure() {
  var root = document.documentElement;
  root.style.setProperty("--vh", window.innerHeight + "px");
  root.style.setProperty("--hdr", document.querySelector("header").offsetHeight + "px");
}
window.addEventListener("resize", measure);
window.addEventListener("orientationchange", function () { setTimeout(measure, 300); });
measure();

if (window.CloudKit) { start(); } else { window.addEventListener("cloudkitloaded", start); }
</script>
</body>
</html>
